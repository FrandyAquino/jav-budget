appId: com.frandyaquino.javbudget
name: Switch language to Español
tags:
  - core
  - settings
---
- runFlow: ../subflows/launch-fresh.yaml
# The sample data holds DOP and USD, so Home offers a shortcut to Settings.
- tapOn: "Set an exchange rate in Settings to combine your currencies"
- assertVisible: "Settings"
- scrollUntilVisible:
    element: "Language: .*"
- tapOn: "Language: .*"
- waitForAnimationToEnd
- tapOn: "Español"
- assertVisible: "Preferencias"
- scrollUntilVisible:
    element: "Cerrar ajustes"
    direction: UP
- assertVisible: "Ajustes"
- tapOn: "Cerrar ajustes"
- assertVisible: "Inicio"
