appId: com.frandyaquino.javbudget
name: Activity list and search
tags:
  - core
  - transactions
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn: "Activity"
- waitForAnimationToEnd
# Rows read "Edit <title>, <amount>"; the demo dates move with today.
- scrollUntilVisible:
    element: "Edit Weekend coffee.*"
- scrollUntilVisible:
    element: "Search transactions"
    direction: UP
- tapOn: "Search transactions"
- waitForAnimationToEnd
- inputText: "Uber"
- assertVisible: "Edit Uber ride.*"
- assertNotVisible: "Edit Weekend coffee.*"
- eraseText: 10
- inputText: "zzz no match"
- assertVisible: "Nothing here just yet"
