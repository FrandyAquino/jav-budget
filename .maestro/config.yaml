# Maestro workspace: `maestro test .maestro/` runs every flow in flows/.
# https://docs.maestro.dev/api-reference/workspace-configuration
flows:
  - "flows/*"
includeTags:
  - core
executionOrder:
  continueOnFailure: true
# disableAnimations only covers UIKit; flows also waitForAnimationToEnd after
# each tap because Reanimated sheets keep moving, and a short drag after typing in
# forms because Maestro treats fields under the keyboard as visible.
platform:
  ios:
    disableAnimations: true
